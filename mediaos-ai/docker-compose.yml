# MEDIA OS AI — PostgreSQL+pgvector, Redis (LRU, yaddaş limiti), API, worker.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mediaos
      POSTGRES_PASSWORD: mediaos
      POSTGRES_DB: mediaos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Yaddaş limiti + eviction siyasəti: limit dolanda ən az istifadə olunan açarlar silinir
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [backend/.env]
    environment:
      MEDIAOS_DATABASE_URL: postgresql+psycopg://mediaos:mediaos@postgres:5432/mediaos
      MEDIAOS_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker"]
    env_file: [backend/.env]
    environment:
      MEDIAOS_DATABASE_URL: postgresql+psycopg://mediaos:mediaos@postgres:5432/mediaos
      MEDIAOS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
